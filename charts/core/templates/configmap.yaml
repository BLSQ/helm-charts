apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dhis2-core-helm.fullname" . }}
  labels:
    {{- include "dhis2-core-helm.labels" . | nindent 4 }}
data:
  dhis.conf: |
    {{- if .Values.customConfigSnippet }}
    {{- .Values.customConfigSnippet | nindent 4 }}
    {{- end }}
    # Clickhouse configuration
    {{- if .Values.clickhouseAnalytics.enabled }}
    analytics.database = clickhouse
    analytics.connection.url = jdbc:clickhouse://{{ .Values.clickhouseAnalytics.host }}:{{ .Values.clickhouseAnalytics.port }}/${DHIS2_CH_DATABASE}
    analytics.database.catalog = ${DHIS2_CH_DATABASE}
    analytics.connection.username = ${DHIS2_CH_USER}
    analytics.connection.password = ${DHIS2_CH_PASSWORD}
    {{- end }}
    connection.dialect = org.hibernate.dialect.PostgreSQLDialect
    connection.driver_class = org.postgresql.Driver
    connection.url = jdbc:postgresql://${DB_HOSTNAME}/${DB_DATABASE}
    connection.username = ${DB_USERNAME}
    connection.password = ${DB_PASSWORD}
    {{- if .Values.ingress.enabled }}
    server.base.url = http{{ if .Values.ingress.certIssuer }}s{{ end }}://{{ .Values.ingress.hostname }}{{ .Values.ingress.path }}
    server.https = {{ if .Values.ingress.certIssuer }}true{{ else }}false{{ end }}
    {{- end }}
    session.cookie.samesite = {{ .Values.sessionCookieSameSite }}
    filestore.provider = ${S3_PROVIDER}
    filestore.container = ${S3_CONTAINER}
    filestore.endpoint = ${S3_ENDPOINT}
    filestore.location = ${S3_LOCATION}
    filestore.identity = ${S3_IDENTITY}
    filestore.secret = ${S3_SECRET}
    flyway.migrate_out_of_order = ${FLYWAY_MIGRATE_OUT_OF_ORDER}
    flyway.repair_before_migration = ${FLYWAY_REPAIR_BEFORE_MIGRATION}
    enable.query.logging = ${ENABLE_QUERY_LOGGING}
    {{- if .Values.oidc.enabled }}
    # OIDC Configuration
    oidc.oauth2.login.enabled = {{ .Values.oidc.oauth2Login }}
    oidc.provider.azure.0.tenant = {{ .Values.oidc.azure.tenant }}
    oidc.provider.azure.0.client_id = {{ .Values.oidc.azure.clientId }}
    oidc.provider.azure.0.client_secret = {{ .Values.oidc.azure.clientSecret }}
    oidc.provider.azure.0.redirect_url = {{ .Values.oidc.azure.redirectUrl }}
    oidc.logout.redirect_url = {{ .Values.oidc.logoutRedirectUrl }}
    oidc.provider.azure.0.mapping_claim = {{ .Values.oidc.azure.mappingClaim }}
    oidc.provider.azure.0.support_logout = {{ .Values.oidc.azure.supportLogout }}
    {{- end }}

  log4j2.xml: |
    {{- .Files.Get .Values.log4j2 | nindent 4 }}
  server.xml: |
    {{- .Files.Get .Values.serverXml | nindent 4 }}
